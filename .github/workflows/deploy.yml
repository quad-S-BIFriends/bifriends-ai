name: Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            cd /app
            sudo git -C bifriends-ai pull origin main
            sudo docker compose build bifriends-ai
            sudo docker compose up -d bifriends-ai
            sudo docker compose logs bifriends-ai --tail=20
