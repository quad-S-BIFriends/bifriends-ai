services:
  ai:
    build: .
    container_name: bifriends-ai
    ports:
      - "18001:8001"
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      BE_BASE_URL: http://bifriends-be:8080
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      SESSION_DB_URL: sqlite+aiosqlite:///./sessions.db
      APP_ENV: production
      APP_PORT: 8001
    restart: unless-stopped
    networks:
      - bifriends-be-default

networks:
  bifriends-be-default:
    external: true